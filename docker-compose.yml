services:
  postgres:
    image: postgres:16-alpine
    container_name: api-detector-personas-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: people_detector
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d people_detector']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    container_name: api-detector-personas-api
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/people_detector
      DATABASE_SSL: 'false'
      DB_POOL_MAX: 10
      LOG_LEVEL: info
      PEOPLE_API_KEY: ''
      JSON_BODY_LIMIT: 1mb
    ports:
      - '3000:3000'
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
